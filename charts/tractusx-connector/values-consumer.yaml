shared:
    connectorId: &connectorId did:web:consumer-wallet.int.construct-x.net:consumer
    secretAlias: &secretAlias consumersecret
    trustedIssuerId: &trustedIssuerId did:web:issuer.int.construct-x.net:issuer
    clusterIssuer: &clusterIssuer letsencrypt-int
    ingressClass: &ingressClass nginx
    imagePullSecret: &imagePullSecret ghcr-creds
    controlplaneFqdn: &controlplaneFqdn consumer-edc-controlplane.int.construct-x.net
    dataplaneFqdn: &dataplaneFqdn consumer-edc-dataplane.int.construct-x.net

nameOverride: consumer-edc
fullnameOverride: consumer-edc

participant:
    id: *connectorId

iatp:
    id: *connectorId
    trustedIssuerId: *trustedIssuerId
    trustedIssuers:
        - id: *trustedIssuerId
    sts:
        oauth:
            token_url: https://consumer-wallet.int.construct-x.net/api/sts/token
            client:
                id: *connectorId
                secret_alias: *secretAlias
    didService:
        selfRegistration:
            id: *connectorId

controlplane:
    hostname: consumer-edc-controlplane
    imagePullSecrets:
        - name: *imagePullSecret
    env:
        EDC_IAM_ISSUER_ID: *connectorId
        EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: *secretAlias
        EDC_IAM_DID_WEB_USE_HTTPS: true
        TX_EDC_POSTGRESQL_MIGRATION_ASSET_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_AGREEMENTBPNS_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_BPN_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_CONTRACTDEFINITION_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_CONTRACTNEGOTIATION_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_DATAPLANEINSTANCE_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_EDR_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_FEDERATEDCATALOG_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_JTI-VALIDATION_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_POLICY-MONITOR_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_POLICY_ENABLED: false
        TX_EDC_POSTGRESQL_MIGRATION_TRANSFERPROCESS_ENABLED: false
        EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: application/json
        TX_EDC_IAM_IATP_DEFAULT-SCOPES_TEST_ALIAS: org.eclipse.dspace.dcp.vc.type
        TX_EDC_IAM_IATP_DEFAULT-SCOPES_TEST_TYPE: MembershipCredential
        TX_EDC_IAM_IATP_DEFAULT-SCOPES_TEST_OPERATION: read
    ingresses:
        ## Public / Internet facing Ingress
        - enabled: true
          hostname: *controlplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *controlplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - protocol
              - management      ## exposed only for testing purposes
          className: *ingressClass
          tls:
              enabled: true
              secretName: consumer-edc-cp-tls
          certManager:
              clusterIssuer: *clusterIssuer
        ## Private / Intranet facing Ingress
        - enabled: false
          hostname: *controlplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *controlplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - management
              - control
              - validation
              - metrics
          className: *ingressClass
          tls:
              enabled: true
              secretName: consumer-edc-cp-int-tls
          certManager:
              clusterIssuer: *clusterIssuer

dataplane:
    hostname: consumer-edc-dataplane
    imagePullSecrets:
        - name: *imagePullSecret
    token:
        signer:
            privatekey_alias: cons_priv
        verifier:
            publickey_alias: cons_pub
    env:
        EDC_IAM_ISSUER_ID: *connectorId
        EDC_IAM_TRUSTED-ISSUER_EXAMPLE_ID: *trustedIssuerId
        EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: *secretAlias
        EDC_IAM_DID_WEB_USE_HTTPS: true
        EDC_DATA_PLANE_SELF_UNREGISTRATION: true
        EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: application/json
    ingresses:
        ## Public / Internet facing Ingress
        - enabled: true
          hostname: *dataplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *dataplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - public
              - proxy
              - management    ## exposed only for testing purposes
          className: *ingressClass
          tls:
              enabled: true
              secretName: consumer-edc-dp-tls
          certManager:
              clusterIssuer: *clusterIssuer
        ## Private / Intranet facing Ingress
        - enabled: false
          hostname: *dataplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *dataplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - management
              - control
              - metrics
          className: *ingressClass
          tls:
              enabled: true
              secretName: consumer-edc-dp-int-tls
          certManager:
              clusterIssuer: *clusterIssuer

postgresql:
    primary:
        persistence:
            enabled: true
    readReplicas:
        persistence:
            enabled: true
