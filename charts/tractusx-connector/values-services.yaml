---
# Default values for eclipse-dataspace-connector.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

fullnameOverride: "edc"
nameOverride: "edc"

participant:
    id: did:web:wallet.int.construct-x.net:user

iatp:
    id: ""                                       # empty => inherits participant.id
    trustedIssuerId: did:web:issuer.int.construct-x.net:issuer
    trustedIssuers:
        - id: did:web:issuer.int.construct-x.net:issuer
    sts:
        oauth:
            token_url: https://wallet.int.construct-x.net/api/sts/token
            client:
                id: ""                           # empty => inherits participant.id
                secret_alias: usersecret
    didService:
        selfRegistration:
            id: ""                               # empty => inherits participant.id

controlplane:
    hostname: controlplane
    # Single public URL for the control plane. The private ingress is auto-derived as internal-<fqdn>.
    fqdn: edc-controlplane.services.construct-x.net
    imagePullSecrets:
        - name: registry-creds
    env:
        EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: usersecret
    ingresses:
        ## Public / Internet facing Ingress -> hostname = controlplane.fqdn
        - enabled: true
          annotations:
              cert-manager.io/cluster-issuer: letsencrypt-serv
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - protocol
          className: nginx
          tls:
              enabled: true
              secretName: ""
          certManager:
              clusterIssuer: letsencrypt-serv
        ## Private / Intranet facing Ingress -> hostname = internal-<controlplane.fqdn>
        - enabled: true                         # enabled for API testing
          annotations:
              cert-manager.io/cluster-issuer: letsencrypt-serv
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - management
              - control
              - validation
              - metrics
          className: nginx
          tls:
              enabled: true
              secretName: ""
          certManager:
              clusterIssuer: letsencrypt-serv

dataplane:
    hostname: dataplane
    # Single public URL for the data plane. The private ingress is auto-derived as internal-<fqdn>.
    fqdn: edc-dataplane.services.construct-x.net
    imagePullSecrets:
        - name: registry-creds
    token:
        signer:
            privatekey_alias: prov_priv
        verifier:
            publickey_alias: prov_pub
    env:
        EDC_IAM_TRUSTED-ISSUER_EXAMPLE_ID: did:web:issuer.int.construct-x.net:issuer
        EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: usersecret
    ingresses:
        ## Public / Internet facing Ingress -> hostname = dataplane.fqdn
        - enabled: true
          annotations:
              cert-manager.io/cluster-issuer: letsencrypt-serv
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - public
              - proxy
          className: nginx
          tls:
              enabled: true
              secretName: ""
          certManager:
              clusterIssuer: letsencrypt-serv
        ## Private / Intranet facing Ingress -> hostname = internal-<dataplane.fqdn>
        - enabled: true                         # enabled for API testing
          annotations:
              cert-manager.io/cluster-issuer: letsencrypt-serv
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - management
              - control
              - metrics
          className: nginx
          tls:
              enabled: true
              secretName: ""
          certManager:
              clusterIssuer: letsencrypt-serv

postgresql:
    primary:
        persistence:
            enabled: true
    readReplicas:
        persistence:
            enabled: true
