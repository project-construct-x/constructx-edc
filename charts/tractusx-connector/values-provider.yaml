_anchors:
    connectorId: &connectorId did:web:provider-idhub.staging.construct-x.net:provider
    secretAlias: &secretAlias providersecret
    trustedIssuerId: &trustedIssuerId did:web:local-issuer-service.staging.construct-x.net:issuer
    clusterIssuer: &clusterIssuer letsencrypt-staging
    ingressClass: &ingressClass nginx
    imagePullSecret: &imagePullSecret registry-creds
    controlplaneFqdn: &controlplaneFqdn provider-conn-controlplane.staging.construct-x.net
    dataplaneFqdn: &dataplaneFqdn provider-conn-dataplane.staging.construct-x.net

nameOverride: provider-conn

participant:
    id: *connectorId

iatp:
    id: *connectorId
    trustedIssuerId: *trustedIssuerId
    trustedIssuers:
        - id: *trustedIssuerId
    sts:
        oauth:
            token_url: https://provider-idhub.staging.construct-x.net/api/sts/token
            client:
                id: *connectorId
                secret_alias: *secretAlias
    didService:
        selfRegistration:
            id: *connectorId

controlplane:
    hostname: provider-conn-controlplane
    image:
        repository: registry.onstackit.cloud/constructx/con-x-controlplane-postgresql-hashicorp-vault
    imagePullSecrets:
        - name: *imagePullSecret
    endpoints:
        management:
            authKey: provider-conn-controlplane-management-password
    env:
        EDC_IAM_ISSUER_ID: *connectorId
        EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: *secretAlias
    ingresses:
        - enabled: true
          hostname: *controlplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *controlplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - default
              - management
              - protocol
              - validation
              - metrics
          className: *ingressClass
          tls:
              enabled: true
              secretName: provider-conn-cp-tls
          certManager:
              clusterIssuer: *clusterIssuer

dataplane:
    hostname: provider-conn-dataplane
    image:
        repository: registry.onstackit.cloud/constructx/con-x-dataplane-postgresql-hashicorp-vault
    imagePullSecrets:
        - name: *imagePullSecret
    token:
        signer:
            privatekey_alias: prov_priv
        verifier:
            publickey_alias: prov_pub
    env:
        EDC_IAM_ISSUER_ID: *connectorId
        EDC_IAM_TRUSTED-ISSUER_EXAMPLE_ID: *trustedIssuerId
        EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: *secretAlias
    ingresses:
        - enabled: true
          hostname: *dataplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *dataplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - public
          className: *ingressClass
          tls:
              enabled: true
              secretName: provider-conn-dp-tls
          certManager:
              clusterIssuer: *clusterIssuer

postgresql:
    primary:
        persistence:
            enabled: true
    readReplicas:
        persistence:
            enabled: true
