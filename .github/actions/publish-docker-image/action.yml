---
name: "Publish Docker Image"
description: "Build and publish a Docker Image to GHCR"
inputs:
  rootDir:
    required: true
    description: "The directory where the notice.md file and the src/main/docker directory are located"
  namespace:
    required: false
    default: "project-construct-x"
    description: "The Docker image namespace"
  imagename:
    required: true
    description: "the name of the image"
  gh_user:
    required: false
    description: "GitHub Actor. No push is done if omitted"
  gh_token:
    required: false
    description: "GitHub Token. No push is done if omitted"
  docker_tag:
    required: false
    description: 'additional docker tags'
  registry:
    required: false
    description: 'GitHub Container Registry'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    ###############################################
    # Enable emulation for cross-arch builds
    ###############################################
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    ###############################################
    # Use Docker Buildx (required for multi-arch)
    ###############################################
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    #####################
    # Login to DockerHub
    #####################
    - name: DockerHub login
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.gh_user }}
        password: ${{ inputs.gh_token }}

    #####################
    # Build JAR file
    #####################
    - uses: ./.github/actions/setup-java
    - name: Build Controlplane
      shell: bash
      run: |-
        ./gradlew -p ${{ inputs.rootDir }} shadowJar

    ###############################
    # Set metadata of docker image
    ###############################
    # Create SemVer or ref tags dependent of trigger event
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ inputs.registry }}/${{ inputs.namespace }}/${{ inputs.imagename }}
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.docker_tag }}
          type=semver,pattern={{major}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{raw}}
          type=match,pattern=\d.\d.\d
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha

    ###############################
    # Build and push the image
    ###############################
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.rootDir }}
        file: ${{ inputs.rootDir }}/build/resources/docker/Dockerfile
        build-args: |
          JAR=build/libs/${{ inputs.imagename }}.jar
          OTEL_JAR=build/resources/otel/opentelemetry-javaagent.jar
          ADDITIONAL_FILES=build/legal/*
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
